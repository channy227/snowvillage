<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="눈 내리는 크리스마스 밤 광장을 거닐며 트리에 장식을 달고 소원 등불을 띄우는 작은 쉼터">
<meta property="og:title" content="눈꽃 광장">
<meta property="og:description" content="눈 내리는 크리스마스 광장에서 잠깐 쉬어가기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M16 3 6 17h5l-6 9h22l-6-9h5z%22 fill=%22%232f6b4f%22/%3E%3Ccircle cx=%2216%22 cy=%223.5%22 r=%222.5%22 fill=%22%23ffd166%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>눈꽃 광장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D night plaza; HUD floats at the corners, an action dock sits at the bottom like a shop counter */
:root{
  --night:#0c1426;
  --ink:#f4efe6;
  --muted:#aab4c8;
  --glass:rgba(14,23,44,.74);
  --glass-solid:#121c35;
  --line:rgba(255,232,196,.16);
  --ember:#ffb75e;
  --ember-soft:rgba(255,183,94,.14);
  --holly:#d5544a;
  --display:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);line-height:1.6}

.top{
  position:fixed;z-index:5;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));
  right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.brand h1{
  margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,4.4vw,32px);letter-spacing:.04em;
  text-shadow:0 0 22px rgba(255,183,94,.35),0 2px 6px rgba(0,0,0,.4);
}
.brand p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.pill b{color:var(--ember);font-weight:400;letter-spacing:.02em}
.viewbtns{display:flex;gap:6px}
.chatbtn{font-variant-numeric:tabular-nums}
#chatLog{
  position:fixed;z-index:4;pointer-events:none;display:flex;flex-direction:column;gap:4px;
  left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));top:calc(env(safe-area-inset-top,0px) + 84px);
  width:min(300px,calc(100% - 230px));
}
#logHist,#logSys{display:flex;flex-direction:column;gap:4px}
#logHist div,#logSys div{background:rgba(10,17,34,.62);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12.5px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere;transition:opacity .8s}
#logSys div{color:var(--muted);background:rgba(10,17,34,.45)}
#chatLog i{font-style:normal;color:var(--muted);font-size:11px;margin-left:6px;white-space:nowrap}
#chatLog.folded #logHist{display:none}
#logToggle{pointer-events:auto;align-self:flex-start;font:inherit;font-size:11.5px;color:var(--muted);background:rgba(10,17,34,.55);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
#logToggle:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#chatLog b{color:var(--ember);font-weight:400;margin-right:5px}
#chatBar{
  position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  width:min(560px,calc(100% - 32px));box-sizing:border-box;display:flex;gap:6px;align-items:center;padding:6px;
  background:var(--glass-solid);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.45);
}
#chatInput{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#chatInput:focus{outline:2px solid rgba(255,183,94,.6);outline-offset:1px}
#bName{flex:none;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:inherit;font-size:12px;color:var(--ember);background:transparent;border:1px solid rgba(255,183,94,.4);border-radius:10px;padding:8px;cursor:pointer}
#bName[aria-pressed="true"]{background:var(--ember-soft)}
#chatSend{flex:none;font:inherit;font-size:14px;color:#1c1408;background:var(--ember);border:0;border-radius:10px;padding:8px 12px;cursor:pointer}
#chatClose{flex:none;font:inherit;font-size:14px;color:var(--muted);background:transparent;border:0;padding:8px 6px;cursor:pointer}
#chatBar button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.tag.peer{background:rgba(24,44,78,.72);border-color:rgba(160,200,255,.3)}
@media (max-width:460px){#chatBar{bottom:calc(env(safe-area-inset-bottom,0px) + 222px)} #bName{max-width:76px} #chatLog{top:calc(env(safe-area-inset-top,0px) + 160px);width:calc(100% - 32px);max-width:420px;gap:3px} #logHist,#logSys{gap:3px} #logHist div,#logSys div{font-size:12px;line-height:1.35;padding:3px 8px;background:rgba(10,17,34,.5)}}
.skybtn{pointer-events:auto;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.skybtn[aria-pressed="true"]{border-color:rgba(255,183,94,.5);background:rgba(58,40,20,.8);color:#ffe2b8}
.skybtn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.tally{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;background:rgba(10,17,34,.55);border-radius:999px;padding:3px 10px;white-space:nowrap}

#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.tag{
  position:absolute;left:0;top:0;padding:3px 10px;border-radius:999px;font-size:12px;white-space:nowrap;
  background:rgba(10,17,34,.66);border:1px solid var(--line);color:var(--ink);will-change:transform;transition:opacity .8s;
}
.tag.wish{
  white-space:normal;max-width:200px;text-align:center;line-height:1.45;padding:5px 12px;
  background:rgba(58,34,10,.66);border-color:rgba(255,183,94,.42);color:#ffe7c4;
}
.tag.say{
  white-space:normal;max-width:190px;text-align:center;line-height:1.45;padding:5px 11px;
  background:rgba(244,239,230,.94);border-color:transparent;color:#24190f;transition:none;
}
.tag.say b{display:block;font-weight:400;font-size:11px;color:#a8432f;letter-spacing:.02em}

#toast{
  position:fixed;z-index:7;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 92px);
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .35s,transform .35s;
  max-width:calc(100% - 32px);text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

#fade{position:fixed;inset:0;z-index:9;background:#05070d;opacity:0;pointer-events:none}
.floatbtn{
  position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 98px);
  font:inherit;font-size:14px;color:#1c1408;background:var(--ember);border:1px solid var(--ember);cursor:pointer;padding:9px 18px;
}
.floatbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:460px){.floatbtn{bottom:calc(env(safe-area-inset-bottom,0px) + 226px)}}
#bJump{
  position:fixed;z-index:6;width:66px;height:66px;border-radius:50%;touch-action:none;cursor:pointer;
  right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  font:inherit;font-size:14px;color:#1c1408;background:var(--ember);border:1px solid rgba(255,226,184,.6);box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#bJump:active{transform:scale(.94)}
@media (max-width:460px){body #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 280px)}}
#bJump:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#joy{
  position:fixed;z-index:6;width:108px;height:108px;border-radius:50%;touch-action:none;
  left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 104px);
  background:rgba(14,23,44,.42);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
#joy .knob{
  position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:rgba(255,226,184,.88);box-shadow:0 2px 10px rgba(0,0,0,.35);pointer-events:none;
}
#joy.on{border-color:rgba(255,183,94,.55)}
#nowPlaying{
  position:fixed;z-index:6;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  display:flex;align-items:center;gap:8px;max-width:min(340px,calc(100% - 32px));padding:5px 6px 5px 12px;
}
#nowPlaying .note{color:var(--ember)}
#nowTitle{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#bNext{flex:none;font:inherit;font-size:12px;color:#1c1408;background:var(--ember);border:0;border-radius:999px;padding:5px 10px;cursor:pointer}
#bNext:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:460px){#nowPlaying{bottom:calc(env(safe-area-inset-bottom,0px) + 180px);max-width:calc(100% - 160px)}}
#sitbadge{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
  background:var(--ember-soft);border:1px solid rgba(255,183,94,.35);color:#ffe2b8;border-radius:999px;
  padding:6px 14px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;
}

#hint{
  position:fixed;z-index:5;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  width:min(360px,calc(100% - 32px));
  background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.55;color:var(--ink);
}
#hint p{margin:0;flex:1;min-width:0}
#hint button{
  flex:none;font:inherit;font-size:13px;color:var(--night);background:var(--ember);border:0;border-radius:10px;
  padding:7px 12px;cursor:pointer;
}

.dock{
  position:fixed;z-index:6;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:2px;padding:6px;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.dock button{
  appearance:none;border:1px solid transparent;background:transparent;color:var(--ink);
  font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 12px 8px;border-radius:14px;cursor:pointer;min-width:70px;white-space:nowrap;
  transition:background .2s,border-color .2s,color .2s;
}
.dock button:hover{background:rgba(255,255,255,.06)}
.dock button[aria-pressed="true"]{border-color:rgba(255,183,94,.5);background:var(--ember-soft);color:#ffe2b8}
.dock button:focus-visible,#hint button:focus-visible,.sheet button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.dock svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:460px){
  .dock{width:calc(100% - 32px)}
  .dock button{flex:1;min-width:0;padding:9px 2px 8px;font-size:11px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 104px)}
}

#wishModal{
  position:fixed;inset:0;z-index:10;background:rgba(4,8,18,.55);
  display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.sheet{
  width:min(420px,100%);background:var(--glass-solid);border:1px solid var(--line);border-radius:20px;
  padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;
}
.sheet h2{margin:0;font-family:var(--display);font-size:22px;text-wrap:balance}
.sheet p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.sheet textarea{
  width:100%;box-sizing:border-box;resize:none;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
.sheet textarea:focus{outline:2px solid rgba(255,183,94,.6);outline-offset:1px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet .btns{display:flex;gap:8px}
.sheet button{font:inherit;font-size:14px;border-radius:10px;padding:8px 14px;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.primary{background:var(--ember);color:#1c1408;border:1px solid var(--ember)}
.primary:disabled{opacity:.45;cursor:default}
.wishes{list-style:none;margin:4px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.wishes li{display:flex;gap:10px;font-size:13px;line-height:1.5}
.wishes time{color:var(--ember);font-variant-numeric:tabular-nums;flex:none}
.wishes span{min-width:0;overflow-wrap:anywhere}
.wishes:empty{display:none}
@media (prefers-reduced-motion:reduce){#toast,.tag{transition:none}}
</style>
</head>
<body>


<div id="stage"></div>
<div id="labels"></div>

<header class="top">
  <div class="brand">
    <h1>눈꽃 광장</h1>
    <p id="me">나: 작은 눈송이</p>
  </div>
  <div class="meta">
    <span class="pill" id="dday">크리스마스까지 <b>D-43</b></span>
    <span class="tally" id="tally">장식 0 · 소원 0 · 장터 0/8</span>
    <div class="viewbtns">
      <button class="pill skybtn" id="bView" type="button" aria-pressed="false" title="단축키 V">1인칭 보기</button>
      <button class="pill skybtn" id="bSky" type="button" aria-pressed="false">밤하늘 보기</button>
    </div>
    <button class="pill skybtn chatbtn" id="bChat" type="button" aria-pressed="false" title="Enter 키로도 열 수 있어요">채팅 · <span id="onlineN">1</span>명</button>
  </div>
</header>
<div id="chatLog"><button id="logToggle" type="button" aria-expanded="true" hidden>대화 접기</button><div id="logHist" aria-live="polite"></div><div id="logSys" aria-live="polite"></div></div>
<form id="chatBar" hidden autocomplete="off">
  <button id="bName" type="button" title="이름 바꾸기"></button>
  <input id="chatInput" type="text" maxlength="80" placeholder="메시지를 입력하세요" enterkeyhint="send">
  <button id="chatSend" type="submit">보내기</button>
  <button id="chatClose" type="button" aria-label="채팅 닫기">✕</button>
</form>

<div id="toast" role="status" aria-live="polite"></div>
<button id="bDown" class="pill floatbtn" type="button" hidden>전망대에서 내려가기</button>
<button id="bExit" class="pill floatbtn" type="button" hidden>가게에서 나가기</button>
<div id="fade" aria-hidden="true"></div>
<button id="bJump" type="button" hidden>점프</button>
<div id="joy" hidden aria-hidden="true"><div class="knob"></div></div>
<div id="nowPlaying" class="pill" hidden><span class="note" aria-hidden="true">♪</span><span id="nowTitle"></span><button id="bNext" type="button">다음 곡</button></div>
<div id="sitbadge" hidden>벤치에서 쉬는 중 · <span id="sittime">0:00</span></div>

<aside id="hint">
  <p>화면을 끌어 둘러보고 눈 위를 누르면 걸어가요. 트리, 장터, 상점, 이웃, 전망대, 밤하늘을 눌러 보고, 채팅으로 다른 방문자와 이야기해 보세요.</p>
  <button id="hintClose" type="button">알겠어요</button>
</aside>

<nav class="dock" aria-label="광장에서 할 수 있는 일">
  <button id="bOrn" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.5h4V4.5h-4z"/><path d="M12 4.5V2.5"/><circle cx="12" cy="14" r="7"/><path d="M5.6 12.5c3 1.6 9.8 1.6 12.8 0"/></svg>
    <span>장식 달기</span>
  </button>
  <button id="bWish" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h8l1.2 3v7L16 19H8l-1.2-3V9z"/><path d="M12 2.5V6M10 21.5h4"/><path d="M12 10.5v4"/></svg>
    <span>소원 띄우기</span>
  </button>
  <button id="bCocoa" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M16 11.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 3.5c0 1.6 1.5 1.6 1.5 3.5M12.5 3.5c0 1.6 1.5 1.6 1.5 3.5"/></svg>
    <span id="cocoaLbl">핫초코</span>
  </button>
  <button id="bMusic" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
    <span>오르골</span>
  </button>
  <button id="bSnow" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v19M3.8 7.2l16.4 9.6M3.8 16.8l16.4-9.6"/><path d="M9.5 4.2 12 6l2.5-1.8M9.5 19.8 12 18l2.5 1.8"/></svg>
    <span id="snowLbl">눈 · 보통</span>
  </button>
</nav>

<div id="wishModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
    <h2 id="wishTitle">소원 띄우기</h2>
    <p>등불에 적어 밤하늘로 보내요. 적은 소원은 이 기기에만 남아요.</p>
    <textarea id="wishText" maxlength="40" rows="2" placeholder="예: 내년에도 다 같이 건강하게"></textarea>
    <div class="row">
      <span class="count" id="wishCount">0 / 40</span>
      <div class="btns">
        <button id="wishCancel" type="button" class="ghost">닫기</button>
        <button id="wishSend" type="button" class="primary" disabled>등불 띄우기</button>
      </div>
    </div>
    <ul class="wishes" id="wishList"></ul>
  </div>
</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const S={
  get(k,d){try{const v=localStorage.getItem('nkp:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nkp:'+k,JSON.stringify(v))}catch(e){}}
};
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- identity, D-day, tallies ---------- */
const NAMES=['작은 눈송이','졸린 루돌프','포근한 목도리','반짝 전구','말랑 눈사람','뜨끈 군고구마','따뜻한 벙어리장갑','느긋한 썰매'];
let myName=S.get('name',null);
if(!myName){myName=NAMES[Math.floor(Math.random()*NAMES.length)];S.set('name',myName);}
$('#me').textContent='나: '+myName;

(function(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let xmas=new Date(now.getFullYear(),11,25);
  if(today>xmas) xmas=new Date(now.getFullYear()+1,11,25);
  const d=Math.round((xmas-today)/86400000);
  $('#dday').innerHTML=d===0?'<b>메리 크리스마스</b>':'크리스마스까지 <b>D-'+d+'</b>';
})();

let savedOrns=S.get('orns',[]);
let wishes=S.get('wishes',[]);
const STALL_N=8;
let market=S.get('market',[]); if(!Array.isArray(market)) market=[];
function renderTally(){ $('#tally').textContent='장식 '+savedOrns.length+' · 소원 '+wishes.length+' · 장터 '+market.length+'/'+STALL_N; }
renderTally();

let toastTimer=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2600);
}

/* ---------- renderer ---------- */
const stage=$('#stage');
let renderer=null;
if(typeof THREE!=='undefined'){
  try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){renderer=null;}
}
if(!renderer){
  stage.innerHTML='<div class="fallback">이 브라우저에서는 3D 광장을 열 수 없어요.<br>다른 브라우저나 기기에서 다시 열어 주세요.</div>';
  return;
}
const V3=THREE.Vector3, PI=Math.PI;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,innerWidth<700?1.5:2));
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0c1426);
scene.fog=new THREE.FogExp2(0x151f3a,0.021);
const camera=new THREE.PerspectiveCamera(55,1,0.1,400);
let W=1,H=1;
function resize(){
  W=stage.clientWidth||innerWidth; H=stage.clientHeight||innerHeight;
  renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize',resize);

/* ---------- shared textures ---------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const GLOW=(function(){
  const c=mkCanvas(64,64),g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.22,'rgba(255,255,255,.6)');
  gr.addColorStop(.55,'rgba(255,255,255,.14)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
})();
function glow(color,size,opacity){
  const m=new THREE.SpriteMaterial({map:GLOW,color:color,transparent:true,opacity:opacity==null?1:opacity,depthWrite:false,blending:THREE.AdditiveBlending});
  const s=new THREE.Sprite(m); s.scale.set(size,size,1); return s;
}
const lam=c=>new THREE.MeshLambertMaterial({color:c});
const basic=c=>new THREE.MeshBasicMaterial({color:c});
const toon=(c,e)=>new THREE.MeshLambertMaterial({color:c,emissive:new THREE.Color(c).multiplyScalar(e==null?.3:e)});
const UNIT_SPH=new THREE.SphereGeometry(1,18,12);
function ball(r,mat,x,y,z,sx,sy,sz){const m=new THREE.Mesh(UNIT_SPH,mat);m.scale.set(r*(sx||1),r*(sy||1),r*(sz||1));m.position.set(x,y,z);return m;}
const obstacles=[]; // things passers-by step around
let inside=null; // {sh, room} while my character is inside a shop
const heroBlocks=[]; // things my character cannot walk through
const MOON_AZ=5.19-PI; // opposite the observation tower, so the deck looks across the plaza at it

/* ---------- sky, moon, stars ---------- */
(function(){
  const c=mkCanvas(4,256),g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#02050d');gr.addColorStop(.32,'#0a1430');gr.addColorStop(.46,'#1f2c55');
  gr.addColorStop(.5,'#3a3559');gr.addColorStop(.54,'#1b2545');gr.addColorStop(1,'#0e1528');
  g.fillStyle=gr;g.fillRect(0,0,4,256);
  const sky=new THREE.Mesh(new THREE.SphereGeometry(200,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.BackSide,fog:false}));
  scene.add(sky);

  const n=600,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*PI*2, ph=Math.acos(0.15+Math.random()*0.85);
    pos[i*3]=Math.sin(ph)*Math.cos(th)*180; pos[i*3+1]=Math.cos(ph)*180; pos[i*3+2]=Math.sin(ph)*Math.sin(th)*180;
  }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xdfe8ff,size:1.6,sizeAttenuation:false,fog:false,transparent:true,opacity:.8})));

  let sd=7; const rnd=()=>{sd=(sd*16807)%2147483647; return sd/2147483647;};
  const MS=512, mc=mkCanvas(MS,MS), mg=mc.getContext('2d'), MR=230, MC=256;
  const halo=mg.createRadialGradient(MC,MC,MR*.92,MC,MC,MC); halo.addColorStop(0,'rgba(255,246,220,.55)'); halo.addColorStop(1,'rgba(255,246,220,0)');
  mg.fillStyle=halo; mg.fillRect(0,0,MS,MS);
  mg.save(); mg.beginPath(); mg.arc(MC,MC,MR,0,PI*2); mg.clip();
  const base=mg.createRadialGradient(MC-40,MC-50,20,MC,MC,MR); base.addColorStop(0,'#fffcf2'); base.addColorStop(.7,'#f3ecd8'); base.addColorStop(1,'#dcd2b6');
  mg.fillStyle=base; mg.fillRect(0,0,MS,MS);
  [[200,190,72,52],[302,168,56,44],[332,262,62,72],[250,302,46,36],[178,292,36,42],[292,352,42,26],[214,236,30,22]].forEach(m=>{
    mg.fillStyle='rgba(146,146,138,.3)'; mg.beginPath(); mg.ellipse(m[0],m[1],m[2],m[3],rnd()*PI,0,PI*2); mg.fill();});
  for(let i=0;i<420;i++){mg.fillStyle='rgba(120,115,100,'+(rnd()*.12).toFixed(3)+')'; mg.beginPath(); mg.arc(rnd()*MS,rnd()*MS,rnd()*6+1,0,PI*2); mg.fill();}
  for(let i=0;i<28;i++){
    const x=MC+(rnd()-.5)*2*MR*.85, y=MC+(rnd()-.5)*2*MR*.85, r=4+rnd()*15;
    mg.fillStyle='rgba(128,122,108,.26)'; mg.beginPath(); mg.arc(x,y,r,0,PI*2); mg.fill();
    mg.strokeStyle='rgba(255,252,240,.4)'; mg.lineWidth=2; mg.beginPath(); mg.arc(x-1,y-1,r,PI*.9,PI*1.9); mg.stroke();
  }
  const limb=mg.createRadialGradient(MC,MC,MR*.6,MC,MC,MR); limb.addColorStop(0,'rgba(0,0,0,0)'); limb.addColorStop(1,'rgba(90,80,60,.25)');
  mg.fillStyle=limb; mg.fillRect(0,0,MS,MS);
  mg.restore();
  const moon=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(mc),fog:false,transparent:true,depthWrite:false}));
  moon.position.set(Math.cos(MOON_AZ)*150,53,Math.sin(MOON_AZ)*150); moon.scale.set(38,38,1); scene.add(moon);
  const mh=glow(0xfff0d0,95,.2); mh.material.fog=false; mh.position.copy(moon.position); scene.add(mh);
  const mh2=glow(0xb9c8ff,200,.09); mh2.material.fog=false; mh2.position.copy(moon.position); scene.add(mh2);
})();

const tiers=[{r:4.3,h:4.2,y:1.1},{r:3.45,h:3.8,y:3.3},{r:2.55,h:3.2,y:5.5},{r:1.6,h:2.7,y:7.5}];
const treeHit=[];
function treeR(y){let b=0;for(const t of tiers){if(y>=t.y&&y<=t.y+t.h){const r=t.r*(1-(y-t.y)/t.h);if(r>b)b=r;}}return b;}

  const snowy=new THREE.MeshLambertMaterial({color:0xeef3fa,flatShading:true});
  tiers.forEach(t=>{
    const m=new THREE.Mesh(new THREE.ConeGeometry(t.r,t.h,16,1),pine); m.position.y=t.y+t.h/2; scene.add(m); treeHit.push(m);

    const s=new THREE.Mesh(new THREE.ConeGeometry(t.r*.42,t.h*.42,16,1),snowy); s.position.y=t.y+t.h-t.h*.21+.02; scene.add(s);
  });
  // star
  const sh=new THREE.Shape();
  for(let i=0;i<10;i++){const r=i%2?.36:.88,a=i/10*PI*2+PI/2,x=Math.cos(a)*r,y=Math.sin(a)*r;i?sh.lineTo(x,y):sh.moveTo(x,y);}
  sh.closePath();

  const star=new THREE.Mesh(sg,basic(0xffd166)); star.position.y=10.75; scene.add(star);

  window.__star=star; window.__sglow=sglow;

  // garland of warm bulbs spiralling up
  const bulbGeo=new THREE.SphereGeometry(.075,8,6), bulbMat=basic(0xfff0c8);

  const gc=[0xc8433a,0x2f6b4f,0xe0b84a,0x5d7fc4,0xf2ece0,0x9b5fb0,0xc8433a];

function addOrn(o,pop){
  const r=treeR(o.y)*.96+.12;
  const g=new THREE.Group();
  const ball=new THREE.Mesh(ornGeo,basic(o.c)); g.add(ball);
  const cap=new THREE.Mesh(capGeo,basic(0xd9b45a)); cap.position.y=.22; g.add(cap);
  const gl=glow(o.c,.95,.5); g.add(gl);
  g.position.set(Math.cos(o.a)*r,o.y,Math.sin(o.a)*r);
  scene.add(g);
  twinkles.push({s:gl,base:.95,ph:Math.random()*6.28,sp:.8+Math.random()});
  if(pop){g.scale.setScalar(.01);pops.push({g,t:0});}
  return g;
}

function updateWalkers(dt,t){

    if(L){w.a=L.a+w.lead*L.dir; w.r=L.r+(w.dr||0); w.moving=L.moving; w.pace=L.speed;}
    else{
      w.pace=w.speed;
      if(w.pause>0){w.pause-=dt; w.moving=false;}
      else{
        w.next-=dt;
        if(w.next<=0){w.pause=3+Math.random()*3; w.next=14+Math.random()*16; w.moving=false; if(Math.random()<.5) say(w);}
        else{w.moving=true; w.a+=w.dir*w.speed/w.r*dt;}

    let x=Math.cos(w.a)*w.r, z=Math.sin(w.a)*w.r;
    for(const o of obstacles){const dx=x-o.x,dz=z-o.z,d=Math.hypot(dx,dz); if(d<o.m&&d>1e-4){const k=(o.m-d)/d; x+=dx*k; z+=dz*k;}}

  for(let i=0;i<walkers.length;i++){const A=walkers[i]; if(A.spot) continue;
    for(let j=i+1;j<walkers.length;j++){const B=walkers[j]; if(B.spot) continue;

function puff(p,n){

function releaseSnowball(k){
  k.inHand.visible=false;
  const start=k.hands[1].getWorldPosition(new V3());
  let end, dodge=false, tgt=k.tgt;
  if(!tgt||(tgt!=='hero'&&!tgt.root)) return; // a very long frame can skip the aiming step
  if(tgt==='hero'){ end=new V3(hero.position.x,hero.position.y+1.0,hero.position.z); }
  else{
    end=new V3(tgt.root.position.x,.6,tgt.root.position.z);
    dodge=Math.random()<.4;
  }
  const dist=start.distanceTo(end), T=dist/8.5+.25;
  if(dodge){const dir=end.clone().sub(start).setY(0).normalize(); end.addScaledVector(dir,1.6); end.y=.12; tgt.duckAt=Math.max(.01,T-.35);}
  const m=new THREE.Mesh(sbGeo,sbMat); m.position.copy(start); scene.add(m);

}
function updateSnowFight(dt){
  heroHitCool-=dt;
  for(const k of kids){
    const prev=k.throwT; k.throwT=Math.max(0,k.throwT-dt);
    if(prev>.27&&k.throwT<=.27) releaseSnowball(k);
    k.duckT-=dt; k.cheerT-=dt; k.hitT-=dt; k.cool-=dt;
    if(k.duckAt>0){k.duckAt-=dt; if(k.duckAt<=0) k.duckT=.65;}
    if(k.cool<=0&&k.throwT<=0&&k.duckT<=0&&k.faceT<=0){
      k.cool=2.2+Math.random()*3.2;
      const nearHero=!sitting&&!inside&&trip.state==='none'&&Math.hypot(hero.position.x-k.root.position.x,hero.position.z-k.root.position.z)<8;
      if(nearHero&&heroHitCool<=0&&Math.random()<.3){k.tgt='hero'; heroHitCool=10; k.faceT=1.2;}
      else{const opp=kids.filter(o=>o.team!==k.team); k.tgt=opp[Math.floor(Math.random()*opp.length)];}
      k.throwT=.6; k.inHand.visible=true;
    }
  }
  for(let i=snowballs.length-1;i>=0;i--){
    const b=snowballs[i]; b.u+=dt/b.T; const u=Math.min(1,b.u);
    b.m.position.lerpVectors(b.s,b.e,u); b.m.position.y+=b.arc*4*u*(1-u);
    if(u>=1){
      scene.remove(b.m); puff(b.m.position);
      if(b.tgt==='hero'){
        hopT=.35; toast('앗, '+b.thrower.name+'의 눈덩이에 맞았어요!'); say(b.thrower,true,'맞혔다! 같이 해요!');
      }else if(b.dodge){
        if(Math.random()<.35) say(b.tgt,false,'안 맞았지롱!');
      }else{
        b.tgt.hitT=.45; b.thrower.cheerT=.9;
        if(Math.random()<.35) say(b.tgt,false,'으악, 맞았다!'); else if(Math.random()<.25) say(b.thrower,false,'명중!');
      }
      snowballs.splice(i,1);
    }
  }
  for(let i=puffs.length-1;i>=0;i--){
    const p=puffs[i]; p.t+=dt;
    const a=p.pts.geometry.attributes.position.array;
    for(let j=0;j<a.length;j+=3){p.vel[j+1]-=6*dt; a[j]+=p.vel[j]*dt; a[j+1]=Math.max(.03,a[j+1]+p.vel[j+1]*dt); a[j+2]+=p.vel[j+2]*dt;}

  }

function custSay(c,force,text){
  if(!force&&c.sayT>0) return;
  if(!c.bub){c.bub=document.createElement('div'); c.bub.className='tag say'; labels.appendChild(c.bub);}
  const b=document.createElement('b'); b.textContent=c.name;
  c.bub.textContent=''; c.bub.append(b,document.createTextNode(text||c.lines[Math.floor(Math.random()*c.lines.length)]));
  c.sayT=3.2;
}
function addCustomers(R,def){
  const lines=CUST_LINES[def.type], n=CUST_N[def.type]||2;
  const mk=(o,name,extra)=>{
    const m=makeFolk(o); R.g.add(m.root);
    const c=Object.assign({m,name,lines,seed:Math.random()*6,phase:Math.random()*6,sayT:0,bub:null,yaw:0,next:4+Math.random()*10},extra);
    m.root.traverse(q=>{q.userData.cust=c;}); R.custHit.push(m.root); R.cust.push(c); return c;
  };

    const c=mk(Object.assign({scale:st.scale||.95,carry:st.carry,bookColor:st.bookColor},look),st.reader?'책 읽는 손님':'카페 손님',{x:st.x,z:st.z,y:st.y,yaw:st.yaw,reader:!!st.reader,sitter:!!st.sitter});
    c.m.root.position.set(st.x,st.y,st.z); c.m.root.rotation.y=st.yaw;
  });

}

const angTo=(a,b,k)=>{let d=b-a; d=Math.atan2(Math.sin(d),Math.cos(d)); return a+d*Math.min(1,k);};
function updateCustomers(R,t,dt){
  const hx=hero.position.x-R.O.x, hz=hero.position.z-R.O.z;
  for(const c of R.cust){
    if(c.walker){
      let moving=false, pushed=false;
      if(c.state==='walk'){
        c.walkT+=dt;
        const dx=c.tx-c.x, dz=c.tz-c.z, d=Math.hypot(dx,dz);
        if(d<.08||c.walkT>9){c.state=c.next; c.timer=c.state==='pay'?3.4:3+Math.random()*4; if(c.state==='pay'){R.keeper.faceT=2.5; say(R.keeper,false,'계산 도와드릴게요~');}}
        else{const st=Math.min(d,1.1*dt); c.x+=dx/d*st; c.z+=dz/d*st; c.yaw=angTo(c.yaw,Math.atan2(dx,dz),dt*8); moving=true;}
      }else{
        c.yaw=angTo(c.yaw,c.tyaw,dt*5); c.timer-=dt;
        if(c.timer<=0){
          if(c.state==='pay'){c.bought=true; giveBag(c); say(R.keeper,true,'감사합니다! 메리 크리스마스~'); custSay(c,true,'감사합니다~');}
          if(!c.bought&&Math.random()<.35){c.tx=-.8+Math.random()*1.6; c.tz=-R.D/2+2.25; c.tyaw=PI; c.next='pay';}
          else{const sp=R.spots[Math.floor(Math.random()*R.spots.length)]; c.tx=sp[0]; c.tz=sp[1]; c.tyaw=sp[2]; c.next='browse';}
          c.state='walk'; c.walkT=0;
          if(Math.random()<.3) custSay(c);
        }
      }
      // stay clear of furniture, my character and each other
      for(const [bx,bz,m] of R.blocks){const dx=c.x-bx, dz=c.z-bz, d=Math.hypot(dx,dz); if(d<m+.3&&d>1e-4){const k=(m+.3-d)/d; c.x+=dx*k; c.z+=dz*k; pushed=true;}}
      {const dx=c.x-hx, dz=c.z-hz, d=Math.hypot(dx,dz); if(d<1.0&&d>1e-4){const k=(1.0-d)/d; c.x+=dx*k; c.z+=dz*k; pushed=true;}}
      for(const o of R.cust){if(o===c||!o.walker) continue; const dx=c.x-o.x, dz=c.z-o.z, d=Math.hypot(dx,dz); if(d<.8&&d>1e-4){const k=(.8-d)/d*.5; c.x+=dx*k; c.z+=dz*k;}}
      c.x=Math.max(-R.W/2+.6,Math.min(R.W/2-.6,c.x)); c.z=Math.max(-R.D/2+2.1,Math.min(R.D/2-.45,c.z));
      if(c.state==='walk'&&pushed&&Math.hypot(c.tx-c.x,c.tz-c.z)<.7) c.walkT=99;
      c.m.root.position.set(c.x,0,c.z); c.m.root.rotation.y=c.yaw;
      if(moving) c.phase+=dt*7;
      c.m.anim(c,moving,t);
      if(!moving&&c.state==='browse') c.m.body.rotation.x=.08+.05*Math.sin(t*.9+c.seed);
      else if(!moving) c.m.body.rotation.x=0;
    }else{
      c.m.anim(c,false,t);
      c.next-=dt; if(c.next<=0){c.next=10+Math.random()*14; if(Math.random()<.5) custSay(c);}
    }
    if(c.sayT>0){
      c.sayT-=dt;
      if(c.sayT<=0) c.bub.style.visibility='hidden';
      else{tmpV.set(R.O.x+c.x,R.O.y+c.y+c.m.h+.05,R.O.z+c.z); placeLabel(c.bub,tmpV); c.bub.style.opacity=Math.min(1,c.sayT/.5);}
    }
  }
}

function updateTrip(dt){

function updateBursts(dt){
  for(let bi=bursts.length-1;bi>=0;bi--){
    const Bo=bursts[bi]; Bo.t+=dt;
    const k=Bo.t/Bo.life, drag=Math.pow(Bo.drag,dt), g=Bo.grav*dt, n=Bo.n, T=Bo.T, lag=Bo.lag||.03;
    const Pp=Bo.geo.attributes.position.array, C=Bo.geo.attributes.color.array;
    const fade=k<.55?1:Math.max(0,1-(k-.55)/.45), cc=Bo.cB?Math.min(1,Math.max(0,(k-.3)/.25)):0;
    for(let i=0;i<n;i++){
      const a=i*3;
      const vx=Bo.vel[a]*drag, vy=Bo.vel[a+1]*drag-g, vz=Bo.vel[a+2]*drag;
      Bo.vel[a]=vx; Bo.vel[a+1]=vy; Bo.vel[a+2]=vz;
      const px=Bo.pos[a]+vx*dt, py=Bo.pos[a+1]+vy*dt, pz=Bo.pos[a+2]+vz*dt;
      Bo.pos[a]=px; Bo.pos[a+1]=py; Bo.pos[a+2]=pz;
      let br=fade;
      if(Bo.flicker&&k>Bo.flicker) br*=Math.random()<.45?1.4:.06;
      let r=Bo.cA[a], gg=Bo.cA[a+1], b=Bo.cA[a+2];
      if(cc>0){r+=(Bo.cB[a]-r)*cc; gg+=(Bo.cB[a+1]-gg)*cc; b+=(Bo.cB[a+2]-b)*cc;}
      for(let j=0;j<=T;j++){
        const o=(j*n+i)*3, tf=j===0?1:Math.pow(1-j/(T+1),1.6)*.85;
        Pp[o]=px-vx*lag*j; Pp[o+1]=py-vy*lag*j; Pp[o+2]=pz-vz*lag*j;
        C[o]=r*br*tf; C[o+1]=gg*br*tf; C[o+2]=b*br*tf;
      }
    }
    Bo.geo.attributes.position.needsUpdate=true; Bo.geo.attributes.color.needsUpdate=true;
    Bo.mat.size=Bo.size*(1-.25*Math.min(1,k));
    for(const e of Bo.events) if(!e.done&&Bo.t>=e.t){e.done=true; e.fn(Bo);}
    if(Bo.split&&!Bo.splitDone&&Bo.t>=Bo.life-.02){
      Bo.splitDone=true;
      camRight.setFromMatrixColumn(camera.matrixWorld,0); camRight.y=0; camRight.normalize();
      const seeds=[];
      for(let i=0;i<n;i++){const p=new V3(Bo.pos[i*3],Bo.pos[i*3+1],Bo.pos[i*3+2]); [[1,0],[-1,0],[0,1],[0,-1]].forEach(([x,y])=>seeds.push({p,v:new V3(camRight.x*x*6.5,y*6.5,camRight.z*x*6.5)}));}

  if(!holder.bub){holder.bub=document.createElement('div'); holder.bub.className='tag say'; labels.appendChild(holder.bub);}
  const b=document.createElement('b'); b.textContent=name; holder.bub.textContent=''; holder.bub.append(b,document.createTextNode(text));
  holder.bubT=6; holder.bub.style.opacity=1;
}
const meChat={bub:null,bubT:0};
function refreshOnline(){ onlineN.textContent=String(MP.peers.size+1); }
function profile(){ return {n:myName,l:myLook}; }
function setMyName(n){
  n=cleanText(n,10); if(!n) return;
  myName=n; S.set('name',n); $('#me').textContent='나: '+n; nameTag.textContent='나: '+n; bName.textContent=n;
  if(MP.ok) MP.act.pf.send(profile());
  toast('이름을 "'+n+'"(으)로 바꿨어요');
}
function peerOf(id){
  let p=MP.peers.get(id);
  if(!p){
    p={id,name:'방문자',look:0,av:makeAvatar(0),x:0,y:0,z:9.5,yaw:0,tx:0,ty:0,tz:9.5,tyaw:0,jy:0,phase:0,seen:performance.now(),bub:null,bubT:0,known:false,placed:false};
    p.tag=document.createElement('div'); p.tag.className='tag peer'; p.tag.textContent='방문자'; labels.appendChild(p.tag);
    p.av.root.visible=false;
    MP.peers.set(id,p); refreshOnline();
  }
  return p;
}
function dropPeer(id){
  const p=MP.peers.get(id); if(!p) return;
  scene.remove(p.av.root); p.tag.remove(); if(p.bub) p.bub.remove();
  MP.peers.delete(id); refreshOnline();
  if(p.known) logLine('',p.name+'님이 광장을 떠났어요',true);
}
function startMP(){
  if(!MP_ENABLED){ return; }
  try{
    const room=Trystero.joinRoom({appId:'snowplaza-chani-2026'},'plaza');
    MP.room=room; MP.ok=true;
    MP.act.st=room.makeAction('st'); MP.act.ch=room.makeAction('ch'); MP.act.pf=room.makeAction('pf'); MP.act.hs=room.makeAction('hs');
    room.onPeerJoin=id=>{peerOf(id); MP.act.pf.send(profile(),{target:id}); MP.lastState=''; if(chatHist.length) MP.act.hs.send(chatHist.slice(-50),{target:id});};
    MP.act.hs.onMessage=d=>{ if(Array.isArray(d)) addChat(d.slice(-50).map(m=>cleanEntry(m)).filter(Boolean)); };
    room.onPeerLeave=id=>dropPeer(id);
    MP.act.pf.onMessage=(d,meta)=>{
      const p=peerOf(meta.peerId), n=cleanText(d&&d.n,10)||'방문자', l=(d&&LOOKS[d.l])?d.l:0;
      if(l!==p.look){scene.remove(p.av.root); p.av=makeAvatar(l); p.look=l; p.av.root.visible=p.placed;}
      if(!p.known){p.known=true; logLine('',n+'님이 광장에 들어왔어요',true);}
      p.name=n; p.tag.textContent=n;
    };
    MP.act.st.onMessage=(d,meta)=>{
      if(!Array.isArray(d)||d.length<6) return;
      const p=peerOf(meta.peerId), num=v=>Number.isFinite(+v)?+v:0;
      p.tx=num(d[0]); p.ty=num(d[1]); p.tz=num(d[2]); p.tyaw=num(d[3]); p.walk=!!d[4]; p.jy=Math.max(0,Math.min(3,num(d[5])));
      if(!p.placed){p.x=p.tx; p.y=p.ty; p.z=p.tz; p.yaw=p.tyaw; p.placed=true; p.av.root.visible=true;}
      p.seen=performance.now();
    };
    MP.act.ch.onMessage=(d,meta)=>{
      const p=peerOf(meta.peerId), m=cleanEntry({t:d&&d.t,i:d&&d.i,ts:d&&d.ts},p.name); if(!m) return;
      bubbleFor(p,p.name,m.t); addChat([m]);
    };
  }catch(err){ MP.ok=false; }
}
function sendChat(text){
  const t=cleanText(text,80); if(!t) return;
  const now=performance.now(); if(now-MP.lastChat<700){toast('조금 천천히 보내 주세요'); return;}
  MP.lastChat=now;
  const m={i:newId(),n:myName,t,ts:Date.now()};
  bubbleFor(meChat,myName,t); addChat([m]);
  if(MP.ok) MP.act.ch.send({t,i:m.i,ts:m.ts});
  else if(!MP_ENABLED) logLine('','다른 방문자와의 채팅은 외부 사이트(GitHub Pages 등)에서 열었을 때 연결돼요',true);
}
function openChat(){
  chatBar.hidden=false; bChat.setAttribute('aria-pressed','true'); bName.textContent=myName;
  setTimeout(()=>chatInput.focus(),20); fitChatBar();
}
function closeChat(){
  chatBar.hidden=true; bChat.setAttribute('aria-pressed','false'); MP.nameMode=false; bName.setAttribute('aria-pressed','false');
  chatInput.placeholder='메시지를 입력하세요'; chatInput.maxLength=80; chatInput.blur();
}
bChat.addEventListener('click',()=>{hideHint(); chatBar.hidden?openChat():closeChat();});
$('#chatClose').addEventListener('click',closeChat);
bName.addEventListener('click',()=>{
  MP.nameMode=!MP.nameMode; bName.setAttribute('aria-pressed',String(MP.nameMode));
  chatInput.placeholder=MP.nameMode?'새 이름 (10자까지)':'메시지를 입력하세요'; chatInput.maxLength=MP.nameMode?10:80;
  chatInput.value=MP.nameMode?myName:''; chatInput.focus();
});
chatBar.addEventListener('submit',e=>{
  e.preventDefault();
  if(MP.nameMode){setMyName(chatInput.value); MP.nameMode=false; bName.setAttribute('aria-pressed','false'); chatInput.placeholder='메시지를 입력하세요'; chatInput.maxLength=80;}
  else sendChat(chatInput.value);
  chatInput.value='';
});
chatInput.addEventListener('keydown',e=>{ if(e.key==='Escape'){e.preventDefault(); closeChat();} });
// keep the chat box above an on-screen keyboard
function fitChatBar(){
  const vv=window.visualViewport; if(!vv||chatBar.hidden) return;
  const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);
  chatBar.style.bottom=kb>80?(kb+10)+'px':'';
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitChatBar); visualViewport.addEventListener('scroll',fitChatBar);}
const mpTmp=new V3();
function updateMP(dt,t){
  if(MP.ok){
    const now=performance.now();
    if(now-MP.lastSend>125){
      const st=[+hero.position.x.toFixed(2),+hero.position.y.toFixed(2),+hero.position.z.toFixed(2),+heroYaw.toFixed(2),(walking||tourWalk)?1:0,+jumpY.toFixed(2)];
      const key=st.join(',');
      if(key!==MP.lastState||now-MP.lastSend>1000){MP.act.st.send(st); MP.lastState=key; MP.lastSend=now;}
    }
  }
  const k=1-Math.exp(-dt*10);
  for(const p of MP.peers.values()){
    if(performance.now()-p.seen>20000&&p.placed){dropPeer(p.id); continue;}
    if(!p.placed){p.tag.style.visibility='hidden'; continue;}
    const dx=p.tx-p.x, dz=p.tz-p.z, far=Math.hypot(dx,dz)+Math.abs(p.ty-p.y);
    if(far>8){p.x=p.tx; p.y=p.ty; p.z=p.tz;} else {p.x+=dx*k; p.y+=(p.ty-p.y)*k; p.z+=dz*k;}
    let dy=p.tyaw-p.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); p.yaw+=dy*Math.min(1,dt*10);
    const moving=p.walk||Math.hypot(dx,dz)>.05;
    if(moving) p.phase+=dt*9;
    const R=p.av.root, B=p.av.body; R.position.set(p.x,p.y,p.z); R.rotation.y=p.yaw;
    B.position.y=(moving?Math.abs(Math.sin(p.phase))*.09:Math.sin(t*2+p.x)*.015)+p.jy; B.rotation.z=moving?Math.sin(p.phase)*.06:0;
    mpTmp.set(p.x,p.y+2.05+B.position.y,p.z); placeLabel(p.tag,mpTmp);
    if(p.bubT>0){p.bubT-=dt; if(p.bubT<=0) p.bub.style.visibility='hidden'; else{mpTmp.y+=.55; placeLabel(p.bub,mpTmp); p.bub.style.opacity=Math.min(1,p.bubT/.5);}}
  }
  if(meChat.bubT>0){
    meChat.bubT-=dt;
    if(meChat.bubT<=0||fpBlend>.6) meChat.bub.style.visibility='hidden';
    else{mpTmp.set(hero.position.x,hero.position.y+2.6+bodyG.position.y,hero.position.z); placeLabel(meChat.bub,mpTmp); meChat.bub.style.opacity=Math.min(1,meChat.bubT/.5);}
  }
}
if(!MP_ENABLED) onlineN.textContent='1';
startMP();

/* ---------- loop ---------- */
let last=performance.now(), clock=0;
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;

  // keyboard walking (relative to the camera)
  let kx=0,kz=0;
  if(keys.has('w')||keys.has('arrowup'))kz-=1; if(keys.has('s')||keys.has('arrowdown'))kz+=1;
  if(keys.has('a')||keys.has('arrowleft'))kx-=1; if(keys.has('d')||keys.has('arrowright'))kx+=1;
  let mag=1;
  if(!kx&&!kz&&Math.hypot(joyV.x,joyV.y)>.15){kx=joyV.x; kz=joyV.y; mag=Math.min(1,Math.hypot(kx,kz));}
  if(tour.state!=='none'&&tour.state!=='top'){kx=0; kz=0;}
  if(trip.state!=='none'&&trip.state!=='inside'){kx=0; kz=0;}
  walking=false;
  if(kx||kz){
    if(sitting) standUp(); moveTarget=null; onArrive=null;
    const sy=Math.sin(cam.yaw), cy=Math.cos(cam.yaw);
    let vx=kz*sy+kx*cy, vz=kz*cy-kx*sy; const l=Math.hypot(vx,vz); vx/=l; vz/=l;
    const onDeck=tour.state==='top';
    const spd=onDeck?.8:inside?.7:1;
    hero.position.x+=vx*SPEED*spd*mag*dt; hero.position.z+=vz*SPEED*spd*mag*dt;
    if(onDeck){deckTarget=null; clampDeck(hero.position);}
    else if(inside){roomTarget=null; trip.moved=true; clampRoom(hero.position);}
    else{
      const r=Math.hypot(hero.position.x,hero.position.z);
      if(r>19){hero.position.x*=19/r;hero.position.z*=19/r;}
      if(r<4.6){hero.position.x*=4.6/r;hero.position.z*=4.6/r;}
    }
    targetYaw=Math.atan2(vx,vz); walking=true;
  }else if(moveTarget){
    const dx=moveTarget.x-hero.position.x, dz=moveTarget.z-hero.position.z, dist=Math.hypot(dx,dz);
    if(dist<.08){
      moveTarget=null; const cb=onArrive; onArrive=null; if(cb) cb();
    }else{
      let vx=dx/dist, vz=dz/dist;
      const px=hero.position.x, pz=hero.position.z, r=Math.hypot(px,pz);
      if(Math.hypot(px+vx*1.3,pz+vz*1.3)<5.1&&r>.01){
        let tx=-pz/r, tz=px/r; if(tx*vx+tz*vz<0){tx=-tx;tz=-tz;}
        vx=vx*.3+tx; vz=vz*.3+tz; const l=Math.hypot(vx,vz); vx/=l; vz/=l;
      }
      const step=Math.min(dist,SPEED*dt);
      hero.position.x+=vx*step; hero.position.z+=vz*step;
      const nr=Math.hypot(hero.position.x,hero.position.z);
      if(nr<4.6){hero.position.x*=4.6/nr;hero.position.z*=4.6/nr;}
      targetYaw=Math.atan2(vx,vz); walking=true;
      if(fpMode&&ptrs.size===0&&!lookedWhileWalking){let d2=Math.atan2(-vx,-vz)-cam.yaw; d2=Math.atan2(Math.sin(d2),Math.cos(d2)); cam.yaw+=d2*Math.min(1,dt*3);}
    }
  }
  if(!sitting&&tour.state==='none'&&trip.state==='none'&&!inside){for(const o of heroBlocks){const dx=hero.position.x-o.x,dz=hero.position.z-o.z,d=Math.hypot(dx,dz); if(d<o.m&&d>1e-4){const k=(o.m-d)/d; hero.position.x+=dx*k; hero.position.z+=dz*k;}}}
  if(moveTarget){moveT+=dt; if(moveT>9){moveTarget=null; onArrive=null;}}
  updateTour(dt); updateTrip(dt);
  let dy=targetYaw-heroYaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); heroYaw+=dy*Math.min(1,dt*10); hero.rotation.y=heroYaw;

  // body motion
  const walkAnim=walking||tourWalk;
  let by=walkAnim?Math.abs(Math.sin(clock*9))*.09:Math.sin(clock*2)*.015;
  if(hopT>0){hopT=Math.max(0,hopT-dt);by+=Math.sin((1-hopT/.45)*PI)*.45;}
  // jump: a little arc with a squash on landing; the shadow shrinks while airborne
  if(jumpY>0||jumpV>0){jumpV-=20*dt; jumpY+=jumpV*dt; if(jumpY<=0){jumpY=0; jumpV=0; landT=.18;}}
  by+=jumpY;
  {let sq=1; if(landT>0){landT=Math.max(0,landT-dt); sq=1-.18*Math.sin(landT/.18*PI);} else if(jumpY>0) sq=jumpV>0?1.07:.97;
   bodyG.scale.set(1+(1-sq)*.6,sq,1+(1-sq)*.6); hero.userData.shadow.scale.setScalar(1-Math.min(.55,jumpY*.35));}
  bodyG.position.y=by; bodyG.rotation.z=walkAnim?Math.sin(clock*9)*.06:0;
  if(sitting){
    bodyG.rotation.x=Math.sin(clock*1.2)*.02;
    steam.forEach(st=>{const k=(clock*.45+st.ph)%1; st.s.position.set(Math.sin(k*6+st.ph*6)*.05,.18+k*.55,0); st.s.material.opacity=.35*Math.sin(k*PI); st.s.scale.setScalar(.25+k*.35);});
    const secs=Math.floor((performance.now()-sitStart)/1000);
    $('#sittime').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  }else bodyG.rotation.x=0;

  // camera: third person orbits behind my character; first person looks out of its eyes. fpBlend eases between them.
  fpBlend+=((fpMode?1:0)-fpBlend)*Math.min(1,dt*(reduceMotion?20:5));
  if(skyAnim!==null){
    if(fpMode){const tg=skyAnim<0?.62:0; fpE+=(tg-fpE)*Math.min(1,dt*3.5); if(Math.abs(tg-fpE)<.004) skyAnim=null;}
    else{cam.pitch+=(skyAnim-cam.pitch)*Math.min(1,dt*3.5); if(Math.abs(skyAnim-cam.pitch)<.004) skyAnim=null;}
  }
  if(skyYaw!==null){let d=skyYaw-cam.yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); cam.yaw+=d*Math.min(1,dt*3); if(Math.abs(d)<.004) skyYaw=null;}
  {const up=fpMode?fpE>.3:cam.pitch<-.2; if(up!==skyUp){skyUp=up; bSky.setAttribute('aria-pressed',String(up)); bSky.textContent=up?'광장 보기':'밤하늘 보기';}}
  focus.lerp(tmpV.set(hero.position.x,2.6+((tour.state!=='none'||inside)?hero.position.y:0),hero.position.z),1-Math.exp(-dt*(reduceMotion?20:4)));
  const ep=Math.max(cam.pitch,.04), cp=Math.cos(ep), cdist=inside?Math.min(cam.dist,7.5):cam.dist;
  p3.set(focus.x+Math.sin(cam.yaw)*cdist*cp,focus.y+Math.sin(ep)*cdist,focus.z+Math.cos(cam.yaw)*cdist*cp);
  const cr=Math.hypot(p3.x,p3.z);
  if(cr>21.5&&tour.state==='none'&&!inside){p3.x*=21.5/cr; p3.z*=21.5/cr;}
  if(!inside&&p3.y<.6) p3.y=.6;
  if(inside&&p3.y<inside.room.O.y+.6) p3.y=inside.room.O.y+.6;
  l3.set(focus.x,focus.y+cdist*Math.tan(Math.min(1.25,Math.max(0,.04-cam.pitch)*1.3)),focus.z);
  // on the tower deck the third-person camera sits under the roof, just behind my shoulder, looking down at the plaza
  tourCamB+=((tour.state==='top'||tour.state==='step'||tour.state==='back'?1:0)-tourCamB)*Math.min(1,dt*2.5);
  if(tourCamB>.001){
    const sy=Math.sin(cam.yaw), cy=Math.cos(cam.yaw), e=Math.max(-1.4,Math.min(.9,-cam.pitch*1.4)), ce=Math.cos(e);
    tV.set(hero.position.x+sy*.75,hero.position.y+3.45,hero.position.z+cy*.75);
    {const ax=TOWER.axis, dx=tV.x-ax.x, dz=tV.z-ax.z, d=Math.hypot(dx,dz); if(d>2.5){tV.x=ax.x+dx*2.5/d; tV.z=ax.z+dz*2.5/d;}}
    tL.set(tV.x-sy*ce*10,tV.y+Math.sin(e)*10,tV.z-cy*ce*10);
    p3.lerp(tV,tourCamB); l3.lerp(tL,tourCamB);
  }
  const fy=Math.sin(cam.yaw), fz=Math.cos(cam.yaw), ce=Math.cos(fpE);
  p1.set(hero.position.x-fy*.15,hero.position.y+(sitting?1.15:1.35)+bodyG.position.y*.5,hero.position.z-fz*.15);
  l1.set(p1.x-fy*ce*10,p1.y+Math.sin(fpE)*10,p1.z-fz*ce*10);
  camera.position.lerpVectors(p3,p1,fpBlend);
  lookT.lerpVectors(l3,l1,fpBlend);
  camera.lookAt(lookT);
  {const fb=55+20*tourCamB, fov=fb+(fpFov-fb)*fpBlend; if(Math.abs(camera.fov-fov)>.01){camera.fov=fov; camera.updateProjectionMatrix();}}
  hero.visible=fpBlend<.6;

  // snow
  const lv=SNOW_LV[snowLv], v=lv.v*(reduceMotion?.5:1);
  for(let i=0;i<lv.n;i++){
    const j=i*3; snowPos[j+1]-=snowSpd[i]*v*dt;
    snowPos[j]+=Math.sin(clock*.7+snowPh[i])*dt*.35*v;
    if(snowPos[j+1]<0) snowPos[j+1]+=30;
  }
  snowGeo.attributes.position.needsUpdate=true;

  // twinkle
  for(const tw of twinkles){tw.s.material.opacity=.45+.4*Math.sin(clock*tw.sp+tw.ph);}
  window.__star.rotation.y=clock*(reduceMotion?.1:.4);
  window.__sglow.material.opacity=.8+.15*Math.sin(clock*1.7);
  treeLight.intensity=1.6+.15*Math.sin(clock*2.1);

  // new ornament pop
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt*2.4; const k=Math.min(1,p.t);
    const e=1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);
    p.g.scale.setScalar(Math.max(.01,e));
    if(k>=1){p.g.scale.setScalar(1);pops.splice(i,1);}
  }

  // lanterns
  for(let i=lanterns.length-1;i>=0;i--){
    const L=lanterns[i], age=clock-L.born;
    L.g.position.set(L.x0+Math.sin(age*.5+L.seed)*.6*Math.min(1,age/3),L.y0+age*.85,L.z0+Math.cos(age*.4+L.seed)*.4*Math.min(1,age/3));
    L.gl.material.opacity=.75+.2*Math.sin(age*7+L.seed);
    const fade=age>20?Math.max(0,1-(age-20)/8):1;
    L.shell.material.opacity=.95*fade; L.gl.material.opacity*=fade;
    tmpV.copy(L.g.position); tmpV.y+=.6; placeLabel(L.el,tmpV);
    L.el.style.opacity=age<6?1:Math.max(0,1-(age-6)/1.5);
    if(age>28){scene.remove(L.g);L.el.remove();lanterns.splice(i,1);}
  }

  // passers-by and blinking house lights
  updateWalkers(dt,clock); updateFireworks(dt); updateNotes(dt); updateSnowFight(dt); updateWatchers(dt); updateOpenWindows(dt,clock); updateSleigh(dt,clock); updateMP(dt,clock);
  if(houseA){const k=.5+.5*Math.sin(clock*(reduceMotion?.8:2.2)); houseA.material.opacity=.3+.7*k; houseB.material.opacity=.3+.7*(1-k);}

  // tap marker
  if(markerT>0){markerT=Math.max(0,markerT-dt*1.6);marker.material.opacity=markerT*.8;marker.scale.setScalar(1+(1-markerT)*.8);}

  renderer.render(scene,camera);
  tmpV.set(hero.position.x,hero.position.y+2.05+bodyG.position.y,hero.position.z);
  if(fpBlend>.6) nameTag.style.visibility='hidden'; else placeLabel(nameTag,tmpV);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
